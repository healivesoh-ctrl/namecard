<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>디지털 명함</title>
<meta name="description" content="NFC 디지털 명함 — 탭 한 번으로 연락처에 저장" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{
    --ink:#111826;
    --paper:#fbfaf7;
    --card:#ffffff;
    --line:#e6e2d9;
    --accent:#0e6f6e;      /* deep teal — 헬스케어 톤 */
    --accent-soft:#e3f0ef;
    --muted:#6b7280;
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{height:100%;}
  body{
    min-height:100%;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    /* 상단 정렬 + 세로 스크롤 허용 — 카드가 화면보다 길어도 전체가 보이도록 */
    display:flex;align-items:flex-start;justify-content:center;
    padding:16px 12px calc(20px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:400px;}

  /* ── 명함 카드 ─────────────────────────── */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 20px 20px;
    box-shadow:0 18px 40px -18px rgba(17,24,38,.18);
    text-align:center;
    animation:rise .5s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.card{animation:none;}}

  .avatar{
    width:84px;height:84px;border-radius:50%;
    object-fit:cover;display:block;margin:0 auto 12px;
    border:3px solid var(--accent-soft);
    background:var(--accent-soft);
  }
  /* 사진이 없을 때 이니셜 표시 */
  .avatar-fallback{
    width:84px;height:84px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 12px;
    background:var(--accent-soft);color:var(--accent);
    border:3px solid var(--accent-soft);
    font-size:32px;font-weight:800;letter-spacing:-.02em;
  }
  .org{
    font-size:12.5px;font-weight:600;letter-spacing:.06em;
    color:var(--accent);margin-bottom:5px;line-height:1.35;
  }
  .name{font-size:23px;font-weight:800;letter-spacing:-.01em;}
  .title{font-size:14px;color:var(--muted);margin-top:3px;margin-bottom:16px;}

  .divider{height:1px;background:var(--line);margin:0 -20px 16px;}

  .rows{text-align:left;display:flex;flex-direction:column;gap:2px;}
  .row{
    display:flex;align-items:center;gap:12px;
    padding:9px 10px;border-radius:12px;
    text-decoration:none;color:inherit;
    transition:background .15s;
  }
  .row:active{background:var(--accent-soft);}
  .row .ic{
    flex:none;width:34px;height:34px;border-radius:10px;
    background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .row .ic svg{width:17px;height:17px;}
  .row .lbl{font-size:11.5px;color:var(--muted);letter-spacing:.04em;}
  .row .val{font-size:15px;font-weight:600;word-break:break-all;}

  /* ── 학력 · 경력 섹션 ───────────────────── */
  .section{text-align:left;margin-top:2px;}
  .section + .section{margin-top:12px;}
  .section .head{
    font-size:11px;font-weight:700;letter-spacing:.09em;
    color:var(--accent);text-transform:uppercase;
    margin:0 10px 8px;
  }
  .edu{list-style:none;margin:0 10px;display:flex;flex-direction:column;gap:5px;}
  .edu li{
    position:relative;padding-left:15px;
    font-size:13.5px;font-weight:500;line-height:1.4;
  }
  .edu li::before{
    content:"";position:absolute;left:0;top:8px;
    width:5px;height:5px;border-radius:50%;background:var(--accent);
  }
  .career{list-style:none;margin:0 10px;display:flex;flex-direction:column;gap:9px;}
  .career li{display:flex;flex-direction:column;gap:1px;}
  .career .period{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.02em;}
  .career .desc{font-size:13.5px;font-weight:500;line-height:1.4;color:var(--ink);}

  /* ── 저장 버튼 ─────────────────────────── */
  .save{
    margin-top:18px;width:100%;
    background:var(--accent);color:#fff;
    border:0;border-radius:14px;
    padding:14px;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 8px 18px -8px rgba(14,111,110,.55);
    transition:transform .12s, box-shadow .12s;
  }
  .save:active{transform:scale(.98);box-shadow:0 4px 10px -6px rgba(14,111,110,.5);}
  .save svg{width:19px;height:19px;}

  .hint{margin-top:10px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="avatar-fallback" id="avatarFallback" style="display:none"></div>
    <img class="avatar" id="avatar" alt="프로필 사진" style="display:none" />
    <div class="org" id="org"></div>
    <div class="name" id="name"></div>
    <div class="title" id="title"></div>

    <div class="divider"></div>

    <div class="rows">
      <a class="row" id="row-tel">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
        <span><span class="lbl">휴대전화</span><br/><span class="val" id="tel"></span></span>
      </a>
      <a class="row" id="row-email" style="display:none">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
        <span><span class="lbl">이메일</span><br/><span class="val" id="email"></span></span>
      </a>
      <a class="row" id="row-web" style="display:none">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
        <span><span class="lbl">웹사이트</span><br/><span class="val" id="web"></span></span>
      </a>
    </div>

    <!-- 학력 -->
    <div class="section" id="sec-edu" style="display:none">
      <div class="divider" style="margin-top:16px"></div>
      <div class="head">학력</div>
      <ul class="edu" id="eduList"></ul>
    </div>

    <!-- 주요경력 -->
    <div class="section" id="sec-career" style="display:none">
      <div class="divider" style="margin-top:16px"></div>
      <div class="head">주요경력</div>
      <ul class="career" id="careerList"></ul>
    </div>

    <button class="save" id="saveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      연락처에 저장
    </button>
    <p class="hint">버튼을 누르면 연락처 파일(.vcf)이 열립니다.</p>
  </div>
</div>

    { period: "’21.03. ~ ’23.02.", desc: "서울특별시간호사회 이사(홍보위원장)" },
    { period: "’20.03. ~ ’21.12.", desc: "서울대학교병원 의료발전추진팀장" },
    { period: "’17.02. ~ ’19.06.", desc: "서울대학교병원 간호행정교육팀장" },
    { period: "’16.03. ~ ’19.02.", desc: "서울특별시간호사회 위원 / 구 간호사회장" },
  ],
};

/* ══════════════════════════════════════════════════════
   ② 화면 렌더링
   ══════════════════════════════════════════════════════ */
const fullName = CARD.lastName + CARD.firstName;
document.title = `${fullName} | ${CARD.org}`;
document.getElementById("org").textContent   = CARD.org;
document.getElementById("name").textContent  = fullName;
document.getElementById("title").textContent = CARD.title;
document.getElementById("tel").textContent   = CARD.cell;
document.getElementById("row-tel").href      = "tel:" + CARD.cell.replace(/-/g,"");

// 프로필 사진: 있으면 이미지, 없으면 성(姓) 이니셜 원형
if (CARD.photoUrl) {
  const img = document.getElementById("avatar");
  img.src = CARD.photoUrl;
  img.style.display = "block";
} else {
  const fb = document.getElementById("avatarFallback");
  fb.textContent = CARD.lastName;
  fb.style.display = "flex";
}

// 이메일 (있을 때만)
if (CARD.email) {
  const r = document.getElementById("row-email");
  r.style.display = "flex";
  r.href = "mailto:" + CARD.email;
  document.getElementById("email").textContent = CARD.email;
}

// 웹사이트 (있을 때만)
if (CARD.website) {
  const w = document.getElementById("row-web");
  w.style.display = "flex";
  w.href = CARD.website;
  document.getElementById("web").textContent = CARD.website.replace(/^https?:\/\//,"");
}

// 학력 (있을 때만)
if (CARD.education && CARD.education.length) {
  document.getElementById("sec-edu").style.display = "block";
  const ul = document.getElementById("eduList");
  CARD.education.forEach(e => {
    const li = document.createElement("li");
    li.textContent = e;
    ul.appendChild(li);
  });
}

// 주요경력 (있을 때만)
if (CARD.career && CARD.career.length) {
  document.getElementById("sec-career").style.display = "block";
  const ul = document.getElementById("careerList");
  CARD.career.forEach(c => {
    const li = document.createElement("li");
    const p = document.createElement("span"); p.className = "period"; p.textContent = c.period;
    const d = document.createElement("span"); d.className = "desc";   d.textContent = c.desc;
    li.appendChild(p); li.appendChild(d);
    ul.appendChild(li);
  });
}

/* ══════════════════════════════════════════════════════
   ③ vCard 생성 (사진 base64 포함) + 저장
   ══════════════════════════════════════════════════════ */
async function photoToBase64(url){
  try{
    const res  = await fetch(url);
    if(!res.ok) return null;
    const blob = await res.blob();
    const b64  = await new Promise((ok,err)=>{
      const r = new FileReader();
      r.onload  = ()=> ok(r.result.split(",")[1]);
      r.onerror = err;
      r.readAsDataURL(blob);
    });
    const type = blob.type.includes("png") ? "PNG" : "JPEG";
    return { b64, type };
  }catch(e){ return null; }
}

// vCard 규격: 75자 줄바꿈(folding) — 일부 연락처 앱 호환성용
function fold(line){
  const out = [];
  let s = line;
  while (s.length > 74) { out.push(s.slice(0,74)); s = " " + s.slice(74); }
  out.push(s);
  return out.join("\r\n");
}

// vCard 값 이스케이프 (쉼표·세미콜론·줄바꿈)
function esc(v){ return String(v).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n"); }

async function buildVCard(){
  const L = [];
  L.push("BEGIN:VCARD");
  L.push("VERSION:3.0");
  L.push(`N;CHARSET=UTF-8:${CARD.lastName};${CARD.firstName};;;`);
  L.push(`FN;CHARSET=UTF-8:${fullName}`);
  if (CARD.org)   L.push(`ORG;CHARSET=UTF-8:${CARD.org}`);
  if (CARD.title) L.push(`TITLE;CHARSET=UTF-8:${CARD.title}`);
  if (CARD.cell)  L.push(`TEL;TYPE=CELL:${CARD.cell}`);
  if (CARD.email) L.push(`EMAIL;TYPE=INTERNET:${CARD.email}`);
  if (CARD.website) L.push(`URL:${CARD.website}`);

  // 학력·경력을 메모(NOTE)에 담기
  const noteParts = [];
  if (CARD.education && CARD.education.length)
    noteParts.push("[학력]\n" + CARD.education.map(e => "· " + e).join("\n"));
  if (CARD.career && CARD.career.length)
    noteParts.push("[주요경력]\n" + CARD.career.map(c => `· ${c.period}  ${c.desc}`).join("\n"));
  if (noteParts.length)
    L.push(fold(`NOTE;CHARSET=UTF-8:${esc(noteParts.join("\n\n"))}`));

  const photo = CARD.photoUrl ? await photoToBase64(CARD.photoUrl) : null;
  if (photo) L.push(fold(`PHOTO;ENCODING=b;TYPE=${photo.type}:${photo.b64}`));
  L.push("END:VCARD");
  return L.join("\r\n");
}

document.getElementById("saveBtn").addEventListener("click", async ()=>{
  const btn = document.getElementById("saveBtn");
  btn.disabled = true;
  const vcf  = await buildVCard();
  const blob = new Blob([vcf], { type:"text/vcard;charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = `${fullName}.vcf`;
  document.body.appendChild(a);
  a.click();               // iOS: 연락처 미리보기 / Android: 다운로드 후 연락처 앱으로 열기
  a.remove();
  setTimeout(()=>{ URL.revokeObjectURL(url); btn.disabled = false; }, 800);
});
</script>

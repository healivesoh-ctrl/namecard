# Render Blueprint — https://render.com 에서 "New +" → "Blueprint" 로 이 리포를
# 연결하면 자동으로 웹 서비스가 생성됩니다. sync:false 항목은 대시보드에서 직접 입력.
services:
  - type: web
    name: sns-automation
    runtime: docker
    plan: free
    dockerfilePath: ./social-automation/Dockerfile
    dockerContext: ./social-automation
    envVars:
      - key: ANTHROPIC_API_KEY   # Claude API 키 (필수)
        sync: false
      - key: GITHUB_TOKEN        # 초안 커밋용, Contents 읽기/쓰기 권한 (필수)
        sync: false
      - key: ADMIN_PASSWORD      # 대시보드에서 생성/업로드 시 입력할 비밀번호 (필수)
        sync: false
      - key: GH_REPO
        value: healivesoh-ctrl/namecard
      - key: GH_BRANCH
        value: main
      - key: IG_ACCESS_TOKEN     # 인스타그램 업로드 (선택)
        sync: false
      - key: IG_USER_ID          # 인스타그램 업로드 (선택)
        sync: false

  - type: web
    name: kakao-alimtalk
    runtime: docker
    plan: free
    dockerfilePath: ./kakao-alimtalk/Dockerfile
    dockerContext: ./kakao-alimtalk
    healthCheckPath: /healthz
    # 예약 발송을 재배포 후에도 유지하려면 Disk 를 /app/data 에 추가 (유료 플랜):
    # disk: { name: alimtalk-data, mountPath: /app/data, sizeGB: 1 }
    envVars:
      - key: WEBHOOK_SECRET      # 설문폼 웹훅 인증 비밀값 (필수)
        sync: false
      - key: ADMIN_PASSWORD      # 대시보드 비밀번호 (필수)
        sync: false
      - key: ALIMTALK_PROVIDER   # console | solapi | aligo
        value: console
      - key: ALIMTALK_SENDER     # 발신번호 (숫자만)
        sync: false
      - key: SOLAPI_API_KEY
        sync: false
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SOLAPI_PF_ID
        sync: false
      - key: ALIGO_API_KEY
        sync: false
      - key: ALIGO_USER_ID
        sync: false
      - key: ALIGO_SENDER_KEY
        sync: false
      - key: DB_PATH
        value: /app/data/alimtalk.db

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNS 콘텐츠 대시보드</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7fb; --card: #ffffff; --text: #1a1d27; --muted: #6b7280;
    --border: #e5e7eb; --accent: #4f46e5; --accent-soft: #eef2ff;
    --green: #059669; --green-soft: #ecfdf5; --red: #dc2626; --red-soft: #fef2f2;
    --gray-soft: #f3f4f6; --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1a1d25; --text: #e7e9ee; --muted: #9aa1ad;
      --border: #2a2e38; --accent: #818cf8; --accent-soft: #26294a;
      --green: #34d399; --green-soft: #123528; --red: #f87171; --red-soft: #3a1a1a;
      --gray-soft: #23262e; --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 80px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .spacer { flex: 1; }
  .conn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
  .dot.on { background: var(--green); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .sub code { background: var(--gray-soft); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border);
    background: var(--card); color: var(--text); border-radius: 8px; padding: 7px 14px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=text], input[type=password] {
    font: inherit; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text); width: 100%;
  }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
           box-shadow: var(--shadow); padding: 18px; margin-bottom: 20px; }
  .panel h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row input[type=text] { flex: 1; min-width: 220px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 10px; }
  .hidden { display: none !important; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--gray-soft); }
  .card-body { padding: 14px 16px 16px; }
  .card-date { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .card-title { font-weight: 600; font-size: 15px; margin-bottom: 10px;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
  .chip.draft    { background: var(--gray-soft); color: var(--muted); }
  .chip.uploaded { background: var(--green-soft); color: var(--green); }
  .chip.failed   { background: var(--red-soft); color: var(--red); }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .empty .big { font-size: 40px; margin-bottom: 10px; }

  /* 상세 모달 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex;
             align-items: flex-start; justify-content: center; padding: 4vh 16px; z-index: 50; overflow-y: auto; }
  .modal { background: var(--card); border-radius: 16px; max-width: 720px; width: 100%;
           padding: 24px; position: relative; }
  .modal .close { position: absolute; top: 14px; right: 14px; border: none; background: none;
                  font-size: 22px; color: var(--muted); padding: 4px 8px; }
  .modal h3 { font-size: 18px; margin-bottom: 4px; padding-right: 40px; }
  .modal .meta { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .modal img.preview { max-width: 260px; width: 100%; border-radius: 10px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab { padding: 6px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
         background: var(--gray-soft); color: var(--muted); border: none; }
  .tab.active { background: var(--accent-soft); color: var(--accent); }
  .content-box { background: var(--gray-soft); border-radius: 10px; padding: 14px;
                 white-space: pre-wrap; font-size: 14px; max-height: 320px; overflow-y: auto; }
  .content-title { font-weight: 700; margin-bottom: 8px; }
  .tags { margin-top: 10px; font-size: 13px; color: var(--accent); word-break: break-all; }
  .modal .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .status-line { font-size: 13px; margin-top: 12px; color: var(--muted); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 99px;
           font-size: 13.5px; z-index: 99; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4);
          border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📣 SNS 콘텐츠 대시보드</h1>
    <div class="spacer"></div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connLabel">읽기 전용</span></div>
    <button id="btnRefresh">새로고침</button>
    <button id="btnSettings">⚙️ 서버 연결</button>
  </header>
  <div class="sub">
    인스타그램 · 샤오홍슈 · 네이버블로그 자동 생성 콘텐츠 —
    브랜치 <code id="branchLabel">-</code>
  </div>

  <!-- 서버 연결 설정 -->
  <div class="panel hidden" id="settingsPanel">
    <h2>생성 서버 연결 (선택)</h2>
    <div class="row">
      <input type="text" id="apiBase" placeholder="서버 URL 예: https://sns-automation.onrender.com (비우면 읽기 전용)">
      <input type="password" id="apiPw" placeholder="관리 비밀번호" style="max-width:200px">
      <button class="primary" id="btnSaveSettings">저장</button>
    </div>
    <div class="hint">서버를 연결하면 이 화면에서 콘텐츠 생성·인스타그램 업로드까지 가능합니다.
      서버 배포 방법은 리포지토리 social-automation/README.md 참고.</div>
  </div>

  <!-- 콘텐츠 생성 (서버 연결 시) -->
  <div class="panel hidden" id="generatePanel">
    <h2>✨ 새 콘텐츠 생성</h2>
    <div class="row">
      <input type="text" id="topicInput" placeholder="주제 입력 (비우면 설정된 주제 큐에서 자동 선택)">
      <button class="primary" id="btnGenerate">생성하기</button>
    </div>
    <div class="hint" id="genStatus">생성에는 1~2분 정도 걸립니다. 완료되면 목록에 나타납니다.</div>
  </div>

  <div id="listArea"><div class="empty"><div class="big">⏳</div>불러오는 중...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── 설정 ─────────────────────────────────────────────── */
const OWNER = "healivesoh-ctrl";
const REPO = "namecard";
const BASE_PATH = "social-automation/drafts";
// 앞에서부터 초안이 있는 브랜치를 사용. ?branch= 로 강제 지정 가능
const BRANCH_CANDIDATES = ["main", "claude/social-media-automation-system-2fq5tu"];

const qs = new URLSearchParams(location.search);
let branch = qs.get("branch") || null;
let apiBase = localStorage.getItem("sns.apiBase") || "";
let apiPw = localStorage.getItem("sns.apiPw") || "";
let serverOn = false;
let drafts = [];

const $ = (id) => document.getElementById(id);
const PLATFORM_LABEL = { instagram: "인스타그램", xiaohongshu: "샤오홍슈", naver_blog: "네이버블로그" };

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2600);
}
function rawUrl(slug, file) {
  return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${branch}/${BASE_PATH}/${slug}/${file}`;
}

/* ── 데이터 로드 (GitHub API, 인증 불필요 · public repo) ── */
async function listSlugsOn(br) {
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${BASE_PATH}?ref=${encodeURIComponent(br)}`);
  if (r.status === 404) return [];
  if (!r.ok) throw new Error(`GitHub API ${r.status}`);
  const items = await r.json();
  return items.filter(i => i.type === "dir").map(i => i.name);
}

async function loadDrafts() {
  $("listArea").innerHTML = '<div class="empty"><div class="big">⏳</div>불러오는 중...</div>';
  try {
    let slugs = [];
    if (branch) {
      slugs = await listSlugsOn(branch);
    } else {
      for (const br of BRANCH_CANDIDATES) {
        slugs = await listSlugsOn(br);
        branch = br;
        if (slugs.length) break;
      }
    }
    $("branchLabel").textContent = branch;
    const results = await Promise.all(slugs.map(async slug => {
      try {
        const r = await fetch(rawUrl(slug, "post.json"), { cache: "no-store" });
        if (!r.ok) return null;
        return await r.json();
      } catch { return null; }
    }));
    drafts = results.filter(Boolean).sort((a, b) => b.slug.localeCompare(a.slug));
    render();
  } catch (e) {
    $("listArea").innerHTML = `<div class="empty"><div class="big">⚠️</div>불러오기 실패: ${e.message}<br>
      <span style="font-size:13px">GitHub API 시간당 요청 한도(60회)를 넘었을 수 있습니다. 잠시 후 다시 시도하세요.</span></div>`;
  }
}

/* ── 목록 렌더 ────────────────────────────────────────── */
function chipClass(status) {
  if (status === "uploaded") return "uploaded";
  if (status && status.startsWith("failed")) return "failed";
  return "draft";
}
function chipText(name, status) {
  const label = PLATFORM_LABEL[name] || name;
  if (status === "uploaded") return label + " ✓";
  if (status && status.startsWith("failed")) return label + " ✗";
  return label;
}
function render() {
  if (!drafts.length) {
    $("listArea").innerHTML = `<div class="empty"><div class="big">📭</div>아직 생성된 콘텐츠가 없습니다.<br>
      <span style="font-size:13px">서버를 연결해 생성하거나, GitHub Actions / CLI 로 생성하세요.</span></div>`;
    return;
  }
  const grid = document.createElement("div");
  grid.className = "grid";
  drafts.forEach((d, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = () => openDetail(i);
    const img = d.images && d.images.length ? `<img class="thumb" loading="lazy" src="${rawUrl(d.slug, d.images[0])}" alt="">` : "";
    const chips = Object.entries(d.status || {})
      .map(([k, v]) => `<span class="chip ${chipClass(v)}">${chipText(k, v)}</span>`).join("");
    card.innerHTML = `${img}<div class="card-body">
      <div class="card-date">${(d.created_at || "").slice(0, 10)}</div>
      <div class="card-title">${escapeHtml(d.topic)}</div>
      <div class="chips">${chips}</div></div>`;
    grid.appendChild(card);
  });
  $("listArea").innerHTML = "";
  $("listArea").appendChild(grid);
}
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ── 상세 모달 ────────────────────────────────────────── */
function openDetail(index) {
  const d = drafts[index];
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  const platforms = Object.keys(d.contents || {});
  let active = platforms[0];

  const modal = document.createElement("div");
  modal.className = "modal";
  const renderModal = () => {
    const c = d.contents[active] || {};
    const body = escapeHtml(c.body || "");
    const tags = (c.hashtags || []).map(t => "#" + String(t).replace(/^#/, "")).join(" ");
    const statusLine = Object.entries(d.status || {})
      .map(([k, v]) => `${PLATFORM_LABEL[k] || k}: ${escapeHtml(v)}`).join(" · ");
    modal.innerHTML = `
      <button class="close" title="닫기">✕</button>
      <h3>${escapeHtml(d.topic)}</h3>
      <div class="meta">${escapeHtml(d.slug)} · 생성 ${(d.created_at || "").replace("T", " ").slice(0, 16)}</div>
      ${d.images && d.images.length ? `<img class="preview" src="${rawUrl(d.slug, d.images[0])}" alt="카드 이미지">` : ""}
      <div class="tabs">${platforms.map(p =>
        `<button class="tab ${p === active ? "active" : ""}" data-p="${p}">${PLATFORM_LABEL[p] || p}</button>`).join("")}</div>
      <div class="content-box">${c.title ? `<div class="content-title">${escapeHtml(c.title)}</div>` : ""}${body}
        ${tags ? `<div class="tags">${escapeHtml(tags)}</div>` : ""}</div>
      <div class="actions">
        <button data-act="copy-body">본문 복사</button>
        ${c.title ? '<button data-act="copy-title">제목 복사</button>' : ""}
        ${tags ? '<button data-act="copy-tags">태그 복사</button>' : ""}
        <button data-act="copy-all">전체 복사</button>
        ${serverOn && active === "instagram" && d.status?.instagram !== "uploaded"
          ? '<button class="primary" data-act="upload-ig">인스타그램 업로드</button>' : ""}
      </div>
      <div class="status-line">${statusLine}</div>`;
    modal.querySelector(".close").onclick = () => overlay.remove();
    modal.querySelectorAll(".tab").forEach(b => b.onclick = () => { active = b.dataset.p; renderModal(); });
    modal.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
      const cc = d.contents[active] || {};
      const tg = (cc.hashtags || []).map(t => "#" + String(t).replace(/^#/, "")).join(" ");
      if (b.dataset.act === "copy-body") copy(cc.body || "");
      if (b.dataset.act === "copy-title") copy(cc.title || "");
      if (b.dataset.act === "copy-tags") copy(tg);
      if (b.dataset.act === "copy-all") copy([cc.title, cc.body, tg].filter(Boolean).join("\n\n"));
      if (b.dataset.act === "upload-ig") uploadInstagram(d, b);
    });
  };
  renderModal();
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}
function copy(text) {
  navigator.clipboard.writeText(text).then(() => toast("복사되었습니다 — 샤오홍슈·네이버는 붙여넣기로 게시하세요"))
    .catch(() => toast("복사 실패 — 직접 선택해 복사하세요"));
}

/* ── 서버 연동 (생성·업로드) ──────────────────────────── */
async function checkServer() {
  serverOn = false;
  const bases = apiBase ? [apiBase] : [location.origin];
  for (const base of bases) {
    try {
      const r = await fetch(base.replace(/\/$/, "") + "/api/health", { signal: AbortSignal.timeout(6000) });
      if (r.ok) { apiBase = base.replace(/\/$/, ""); serverOn = true; break; }
    } catch { /* 서버 없음 */ }
  }
  $("connDot").classList.toggle("on", serverOn);
  $("connLabel").textContent = serverOn ? "서버 연결됨" : "읽기 전용";
  $("generatePanel").classList.toggle("hidden", !serverOn);
}

async function api(path, body) {
  const r = await fetch(apiBase + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Password": apiPw },
    body: JSON.stringify(body || {}),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
  return data;
}

async function generate() {
  const btn = $("btnGenerate");
  const topic = $("topicInput").value.trim();
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> 생성 중...';
  $("genStatus").textContent = "Claude가 3개 플랫폼 콘텐츠를 생성하고 있습니다 (1~2분)...";
  try {
    const { job_id } = await api("/api/generate", { topic: topic || null });
    // 작업 완료까지 폴링
    for (let i = 0; i < 120; i++) {
      await new Promise(res => setTimeout(res, 3000));
      const r = await fetch(`${apiBase}/api/jobs/${job_id}`);
      const job = await r.json();
      if (job.status === "done") {
        toast(`생성 완료: ${job.result}`);
        $("genStatus").textContent = "완료! 목록을 갱신합니다.";
        $("topicInput").value = "";
        await loadDrafts();
        break;
      }
      if (job.status === "failed") throw new Error(job.error || "생성 실패");
    }
  } catch (e) {
    toast("오류: " + e.message);
    $("genStatus").textContent = "실패: " + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "생성하기";
  }
}

async function uploadInstagram(d, btn) {
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> 업로드 중...';
  try {
    const res = await api("/api/upload", { slug: d.slug, platform: "instagram" });
    toast(res.message || "업로드 완료");
    await loadDrafts();
    document.querySelector(".overlay")?.remove();
  } catch (e) {
    toast("업로드 실패: " + e.message);
    btn.disabled = false;
    btn.textContent = "인스타그램 업로드";
  }
}

/* ── 이벤트 바인딩 ────────────────────────────────────── */
$("btnRefresh").onclick = loadDrafts;
$("btnSettings").onclick = () => {
  $("settingsPanel").classList.toggle("hidden");
  $("apiBase").value = apiBase;
  $("apiPw").value = apiPw;
};
$("btnSaveSettings").onclick = async () => {
  apiBase = $("apiBase").value.trim();
  apiPw = $("apiPw").value;
  localStorage.setItem("sns.apiBase", apiBase);
  localStorage.setItem("sns.apiPw", apiPw);
  $("settingsPanel").classList.add("hidden");
  await checkServer();
  toast(serverOn ? "서버에 연결되었습니다" : "서버 응답이 없습니다 — 읽기 전용으로 동작");
};
$("btnGenerate").onclick = generate;

(async () => { await Promise.all([checkServer(), loadDrafts()]); })();
</script>
</body>
</html>
